# 放置点坐标（base_link）
place_x: 0.7
place_y: 0.0
place_z: 0.74

# 放置姿态（RPY, 弧度）
place_roll: -1.57
place_pitch: 0.0
place_yaw: 1.57


# 抬升与放置流程参数
lift: 0.00
pre_place: 0.0
retreat: 0.30

# 夹爪打开位置与等待时间
gripper_open: 0.044
gripper_wait: 1.0

# 规划与控制相关（一般不用改）
planning_group: arm_torso
base_frame: base_link
ee_link: gripper_link
gripper_topic: /gripper_controller/command

# 笛卡尔路径参数
eef_step: 0.005
jump_threshold: 0.0

# 放置时桌面碰撞体（优先使用点云估计）
enable_table: true
use_table_cloud: true
table_cloud_topic: /plane_segmentation/table_cloud
table_box_height: 0.70
table_z_offset: 0.16
table_x_offset: 0.05
table_y_margin: 0.05

# 固定桌面参数（use_table_cloud=false 时使用，base_link）
table_center_x: 0.7
table_center_y: 0.0
table_center_z: 0.375
table_size_x: 0.8
table_size_y: 1.5
table_size_z: 0.75