<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Order Status</title>
  <style>
    :root { --bd:#e6e6e6; --muted:#666; --fg:#111; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           margin:0; background:#fafafa; color:var(--fg); }
    .wrap { max-width:720px; margin:0 auto; padding:16px 14px 22px; }
    h2 { margin: 6px 0 12px; font-size: 22px; }
    .card { background:#fff; border:1px solid var(--bd); border-radius:14px; padding:14px; margin:12px 0; }
    .muted { color:var(--muted); font-size: 13px; }
    .kv { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .kv > div { min-width: 220px; }

    /* Status badge */
    .badge {
      display:inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.6px;
      border: 1px solid var(--bd);
    }
    .st-created { background: #FFD54A; color: #111; border-color: #F2C230; }
    .st-green   { background: #16A34A; color: #fff; border-color: #12803B; }
    .st-served  { background: #111;    color: #fff; border-color: #111; }
    .st-denied { background: #DC2626; color: #fff; border-color: #B91C1C; }

    pre { background:#f6f6f6; padding: 12px; border-radius: 12px; overflow:auto; font-size: 15px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Order Status</h2>

    <div class="card">
      <div class="kv">
        <div><b>Table:</b> {{ table_id }}</div>
        <div><b>Order ID:</b> {{ order_id }}</div>
      </div>

      <div style="margin-top:12px;">
        <div class="muted" style="margin-bottom:6px;">STATUS</div>
        {% set st0 = (status or '')|upper %}
        <span class="badge" id="st">{{ st0 }}</span>
      </div>

      <div class="muted" style="margin-top:10px;">Auto refresh every 2 seconds.</div>
    </div>

    <div class="card">
      <b>Items</b>
      <pre id="items">{{ items_pre }}</pre>
      <b>Special request</b>
      <pre>{{ special_request }}</pre>
    </div>
  </div>

<script>
function applyStatusStyle(st) {
  const el = document.getElementById("st");
  if (!el) return;

  // reset
  el.classList.remove("st-created", "st-green", "st-served", "st-cancel");

  const s = (st || "").toUpperCase();
  if (s === "CREATED") {
    el.classList.add("st-created");
  } else if (s === "CONFIRMED" || s === "SERVING") {
    el.classList.add("st-green");
  } else if (s === "SERVED") {
    el.classList.add("st-served");
  } else if (s === "DENIED") {
    el.classList.add("st-denied");
  }
}

async function refresh() {
  const r = await fetch("{{ url_for('api_status', table_id=table_id) }}");
  if (!r.ok) return;
  const j = await r.json();
  if (!j.ok) return;

  const st = j.status;
  const el = document.getElementById("st");
  el.innerText = (st || "").toUpperCase();
  applyStatusStyle(st);
}

// initial style on page load
applyStatusStyle(document.getElementById("st").innerText);

setInterval(refresh, 2000);
</script>
</body>
</html>
