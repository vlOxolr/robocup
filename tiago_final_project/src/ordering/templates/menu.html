<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Table {{ table_id }} - Menu</title>
  <style>
    :root { --fg:#111; --muted:#666; --card:#fff; --bd:#e6e6e6; --btn:#111; --btnfg:#fff; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
           margin: 0; color: var(--fg); background: #fafafa; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px 14px 22px; }
    h2 { margin: 6px 0 10px; font-size: 22px; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.35; }
    .card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 14px; margin: 12px 0; box-shadow: 0 1px 0 rgba(0,0,0,0.03); }
    .row { display:flex; align-items:center; gap: 10px; }
    .name { flex:1; font-size: 18px; font-weight: 650; }
    .qty { display:flex; align-items:center; gap: 10px; }
    .qty input[type=number]{
      width: 72px; height: 42px; font-size: 18px; text-align:center;
      border: 1px solid var(--bd); border-radius: 12px; background:#fff;
    }
    /* 隐藏 number 的小滚轮（手机更干净） */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    .iconbtn{
      width: 44px; height: 44px; border-radius: 12px;
      border: 1px solid var(--bd); background:#fff;
      font-size: 22px; font-weight: 700; line-height: 1;
      display:flex; align-items:center; justify-content:center;
      touch-action: manipulation;
    }
    .iconbtn:active { transform: scale(0.98); }

    textarea { width: 100%; height: 90px; font-size: 16px; padding: 10px 12px;
               border: 1px solid var(--bd); border-radius: 12px; resize: vertical; }
    .submit {
      width: 100%; height: 50px; border: 0; border-radius: 14px;
      background: var(--btn); color: var(--btnfg);
      font-size: 18px; font-weight: 700;
    }
    .submit:active { transform: scale(0.99); }
    .footerpad { height: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Table {{ table_id }} - Menu</h2>
    <p class="muted">Submit once. Re-scan QR will show status if an active order exists.</p>

    <form method="POST" action="{{ url_for('submit_order', table_id=table_id) }}">
      {% for name in menu_items %}
        <div class="card">
          <div class="row">
            <div class="name">{{ name }}</div>
            <div class="qty">
              <button class="iconbtn" type="button" aria-label="decrease" onclick="stepQty('{{ name|e }}', -1)">−</button>
              <input id="qty_{{ name }}" type="number" min="0" max="99" name="qty_{{ name }}" value="0" inputmode="numeric"/>
              <button class="iconbtn" type="button" aria-label="increase" onclick="stepQty('{{ name|e }}', 1)">+</button>
            </div>
          </div>
        </div>
      {% endfor %}

      <div class="card">
        <div style="font-weight:650; margin-bottom:8px;">Special request</div>
        <textarea name="special_request" placeholder="e.g., I would like to pay 100$ tips..."></textarea>
      </div>

      <button class="submit" type="submit">Submit Order</button>
      <div class="footerpad"></div>
    </form>
  </div>

<script>
function stepQty(name, delta){
  const el = document.getElementById("qty_" + name);
  if(!el) return;
  const min = parseInt(el.min || "0", 10);
  const max = parseInt(el.max || "99", 10);
  let v = parseInt(el.value || "0", 10);
  if (isNaN(v)) v = 0;
  v = Math.min(max, Math.max(min, v + delta));
  el.value = v;
}
</script>
</body>
</html>
